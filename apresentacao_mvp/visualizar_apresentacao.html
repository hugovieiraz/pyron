<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyron MVP · Apresentação Executiva Obsidian Frost</title>
    <style>
        :root {
            --bg-abyss: #0a0e14;
            --bg-surface: #10141a;
            --bg-card: #181c22;
            --border-frost: #353940;
            --frost-blue: #a2cbf1;
            --frost-glow: rgba(162, 203, 241, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #dfe2eb;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-abyss);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Top Bar Telemetria */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: rgba(16, 20, 26, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-frost);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-pill {
            background: #1d4a6a;
            border: 1px solid var(--frost-blue);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 4px 14px;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .deck-title {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-ctrl {
            background: #1c2026;
            border: 1px solid var(--border-frost);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ctrl:hover {
            background: #262a31;
            border-color: var(--frost-blue);
            color: #ffffff;
            box-shadow: 0 0 12px var(--frost-glow);
        }

        .btn-pptx {
            background: #1d4a6a;
            border-color: var(--frost-blue);
            color: #ffffff;
        }

        /* Slide Stage */
        main {
            width: 100vw;
            height: calc(100vh - 54px);
            margin-top: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 24px;
        }

        .slide-viewport {
            width: 100%;
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            background: var(--bg-surface);
            border: 1px solid var(--border-frost);
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), 0 0 32px var(--frost-glow);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide-viewport img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Navigation Arrows */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(24, 28, 34, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-frost);
            color: var(--text-primary);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .nav-btn:hover {
            background: #1d4a6a;
            border-color: var(--frost-blue);
            box-shadow: 0 0 16px var(--frost-glow);
        }

        .nav-prev { left: 32px; }
        .nav-next { right: 32px; }

        /* Notes Drawer */
        .notes-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(16, 20, 26, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--frost-blue);
            padding: 20px 32px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 90;
            max-height: 240px;
            overflow-y: auto;
        }

        .notes-panel.open {
            transform: translateY(0);
        }

        .notes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .notes-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--frost-blue);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .notes-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Progress Footer */
        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--frost-blue);
            transition: width 0.3s ease;
            z-index: 101;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-badge">
            <span class="brand-pill">PYRON MVP</span>
            <span class="deck-title">Apresentação Executiva &amp; Embasamento Técnico</span>
        </div>
        <div class="controls">
            <span id="counter" style="font-size: 13px; color: var(--frost-blue); font-weight: 600; margin-right: 8px;">01 / 12</span>
            <button class="btn-ctrl" onclick="toggleNotes()">Notas do Orador (N)</button>
            <button class="btn-ctrl" onclick="toggleFullscreen()">Tela Cheia (F)</button>
            <a class="btn-ctrl btn-pptx" href="pyron_mvp_obsidian_frost.pptx" download>Baixar .PPTX</a>
        </div>
    </header>

    <main>
        <button class="nav-btn nav-prev" onclick="prevSlide()" title="Anterior (←)">&#8592;</button>
        <div class="slide-viewport">
            <img id="current-slide" src="../projects/pyron_mvp_ppt169_20261107/svg_output/P01_hero.svg" alt="Slide Pyron MVP">
        </div>
        <button class="nav-btn nav-next" onclick="nextSlide()" title="Próximo (→)">&#8594;</button>
    </main>

    <div id="notes-panel" class="notes-panel">
        <div class="notes-header">
            <span class="notes-title" id="notes-label">Notas do Orador · Slide 01</span>
            <button class="btn-ctrl" style="padding: 2px 10px; font-size: 11px;" onclick="toggleNotes()">Fechar</button>
        </div>
        <div class="notes-text" id="notes-content">Carregando notas...</div>
    </div>

    <div id="progress" class="progress-bar" style="width: 8.33%;"></div>

    <script>
        const SLIDES = [
            { id: "P01_hero", title: "Abertura Hero e Abstract Executivo", notes: "Apresentamos o Pyron MVP. O Pyron é uma plataforma metrológica termodinâmica 100% offline projetada para subestações elétricas críticas. Unimos a física do efeito Joule, a inversão analítica da curva de Planck e redes neurais transformers RF-DETR com aceleração DirectML na GPU." },
            { id: "P02_joule", title: "O Paradoxo da Baixa Carga e Efeito Joule", notes: "A termografia comum falha gravemente quando inspeciona condutores sob carga baixa. O calor resistivo varia com o quadrado da corrente. Um aquecimento de apenas 5,4 graus a 30% de corrente se transforma em 60 graus a plena carga, atingindo nível de intervenção imediata em 24 horas pela NBR 15866." },
            { id: "P03_planck", title: "Desenrolamento Radiométrico e Inversão de Planck", notes: "Descompactamos o JPEG radiométrico no segmento APP1 da câmera em 1 ms e invertemos a curva de Planck em 9 ms. Em fotos comuns sem radiometria, nosso algoritmo de programação dinâmica rastreia a barra de escala e calibra as temperaturas com erro mediano comprovado de 0,53 °C." },
            { id: "P04_transformers", title: "Detecção de Ativos com Transformers RF-DETR", notes: "Nosso modelo RF-DETR com base DINOv2 foi treinado em fotos reais de subestação. Ele segmenta o corpo do para-raios com AP50 de 0,99, as aletas com 1,00 e os terminais com 0,84 e 0,73, atingindo mAP50 de 0,891 em apenas 71 ms na GPU via DirectML." },
            { id: "P05_segmentation3d", title: "Segmentação Fina SAM 2.1 e Profundidade 3D", notes: "Caixas delimitadoras retangulares tradicionais capturam até 40% de céu frio de fundo (-20 °C a 5 °C), rebaixando a média térmica real do componente. O contorno fino do SAM 2.1 elimina o céu. O Depth Anything 3 estima coordenadas tridimensionais com erro mediano de apenas 5,1%." },
            { id: "P06_arrester_zno", title: "Diagnóstico Especializado de Para-raios ZnO", notes: "Muitos softwares erram ao aplicar correção de corrente I²R a para-raios. Para-raios não transportam corrente de carga; operam sob tensão contínua. Aplicamos a norma internacional IEC 60099-5, onde uma diferença de 2 °C entre fases já requer atenção e 10 °C exige troca imediata." },
            { id: "P07_normative_engine", title: "Motor de Decisão Normativa Dupla NBR 15866", notes: "O Pyron resolve 9 regiões térmicas em 1,8 ms. Ele cruza o aquecimento relativo trifásico corrigido com o percentual da MTA absoluta do componente, enquadrando automaticamente a severidade nos 5 níveis da norma brasileira, de 365 dias a 24 horas." },
            { id: "P08_mobile_telemetry", title: "Telemetria Mobile Edge e Fluxo Óptico", notes: "O inspetor utiliza um smartphone conectado via WebSocket seguro a 15 fps num servidor Uvicorn secundário na porta 8791. O celular calcula o deslocamento por fluxo óptico com erro inferior a 0,3 pixel, mantendo as caixas térmicas alinhadas na tela mesmo com tremor das mãos." },
            { id: "P09_offline_architecture", title: "Arquitetura 100% Offline Edge e Cibersegurança", notes: "Subestações de alta tensão são ambientes isolados da internet. O Pyron opera 100% offline com 128 rotas FastAPI, DirectML homologado para o Windows 11 Smart App Control e banco SQLite WAL com resposta de 58 ms para 6.000 inspeções." },
            { id: "P10_automated_reports", title: "Geração Instantânea de Laudos Regulatórios Typst", notes: "A compilação de relatórios periciais que levava horas em Word é realizada em apenas 32 milissegundos com o motor Typst. Os dados do operador entram por JSON tipado sem risco de injeção, gerando documentos periciais completos para Prontuário NR-10." },
            { id: "P11_business_roi", title: "Valor do Produto: ROI Industrial e Prevenção", notes: "Uma única parada forçada de subestação consome mais de R$ 450.000 por hora em multas da ANEEL. Além disso, evitar a queima de um transformador de força economiza até R$ 3,5 milhões. O Pyron traz retorno sobre o investimento imediato na primeira anomalia prevenida." },
            { id: "P12_roadmap_closing", title: "Cronograma de Homologação e Encerramento", notes: "Com 458 testes automatizados aprovados e arquitetura validada, estamos prontos para o piloto de campo com 1.000 termogramas em subestação real parceira. Agradecemos à Embrapii e convidamos todos a testar o sistema no nosso servidor demonstrativo." }
        ];

        let currentIndex = 0;
        const total = SLIDES.length;

        function updateSlide() {
            const slide = SLIDES[currentIndex];
            const slideImg = document.getElementById("current-slide");
            slideImg.src = `../projects/pyron_mvp_ppt169_20261107/svg_output/${slide.id}.svg`;
            
            document.getElementById("counter").innerText = `${String(currentIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
            document.getElementById("notes-label").innerText = `Notas do Orador · Slide ${String(currentIndex + 1).padStart(2, '0')} - ${slide.title}`;
            document.getElementById("notes-content").innerText = slide.notes;
            document.getElementById("progress").style.width = `${((currentIndex + 1) / total) * 100}%`;
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        function nextSlide() {
            if (currentIndex < total - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function toggleNotes() {
            document.getElementById("notes-panel").classList.toggle("open");
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
                nextSlide();
            } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                prevSlide();
            } else if (e.key.toLowerCase() === "n") {
                toggleNotes();
            } else if (e.key.toLowerCase() === "f") {
                toggleFullscreen();
            }
        });

        // Inicializa o primeiro slide
        updateSlide();
    </script>
</body>
</html>
