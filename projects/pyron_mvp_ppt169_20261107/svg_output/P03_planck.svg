        <text x="88" y="548" font-family="EB Garamond, Georgia, serif" font-size="18" font-weight="600" fill="#FFFFFF">Inversão Analítica da Equação de Planck</text>
        <text x="88" y="578" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">T_obj = B / ln(R1 / (R2 · (S_obj + O)) + F) - 273,15 °C. Onde S_obj desconta emissividade ε e radiação de fundo.</text>
        <text x="88" y="604" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#94A3B8">Reconhecimento da barra testado em 299 termogramas do ScienceDB: escala identificada em 298 casos (99,7% de acerto).</text>
        <text x="88" y="628" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A2CBF1">GARANTIA METROLÓGICA: Arquivo radiométrico é medida física real (9 ms); caminho estimado traz aviso normativo (1,5 s).</text>
