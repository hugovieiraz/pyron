<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
    <!-- Obsidian Frost Background -->
    <rect width="1280" height="720" fill="#10141A"/>
    <!-- Linhas Guia Estruturais -->
    <g id="deck-guides" data-pptx-role="decoration" data-pptx-bounds="56 140 1168 520" stroke="#1E293B" stroke-width="0.5">
        <line x1="56" y1="140" x2="1224" y2="140"/>
        <line x1="56" y1="660" x2="1224" y2="660"/>
    </g>
    
    <!-- Header Telemetria -->
    <g id="slide-header" data-pptx-role="header" data-pptx-bounds="56 36 1168 100">
        <rect x="56" y="36" width="272" height="24" rx="9999" fill="#1D4A6A" stroke="#A2CBF1" stroke-width="0.75"/>
        <text x="76" y="52" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="1.5">IMPACTO INDUSTRIAL &amp; NEGÓCIO</text>
        <text x="56" y="96" font-family="EB Garamond, Georgia, serif" font-size="36" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Retorno sobre Investimento (ROI) e Valor</text>
        <text x="56" y="124" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Como o Pyron Protege Milhões em Ativos e Elimina Multas Regulatórias</text>
    </g>
    <!-- Footer Telemetria -->
    <g id="slide-footer" data-pptx-role="footer" data-pptx-bounds="56 676 1168 28">
        <line x1="56" y1="676" x2="1224" y2="676" stroke="#1E293B" stroke-width="1"/>
        <text x="56" y="694" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">PYRON MVP · TERMOGRAFIA DIGITAL PREDITIVA</text>
        <text x="640" y="694" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">CONFORMIDADE ABNT NBR 15866 &amp; IEC 60099-5 · 100% OFFLINE EDGE</text>
        <text x="1224" y="694" text-anchor="end" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#A2CBF1">11 / 12</text>
    </g>
    
    <!-- Coluna 1 -->
    <g id="roi-1" data-pptx-bounds="56 150 365 496">
        <rect x="56" y="150" width="365" height="496" rx="24" fill="#181C22" stroke="#353940" stroke-width="1"/>
        <rect x="80" y="174" width="160" height="24" rx="9999" fill="#0A0E14"/>
        <text x="160" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#FFB4AB">MULTAS REGULATÓRIAS</text>
        <text x="80" y="234" font-family="EB Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#FFFFFF">Evitação de Desligamentos</text>
        <text x="80" y="280" font-family="EB Garamond, Georgia, serif" font-size="38" font-weight="400" fill="#FFB4AB">&gt; R$ 450 mil</text>
        <text x="80" y="306" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">por hora de interrupção forçada</text>
        <rect x="80" y="334" width="317" height="288" rx="14" fill="#0A0E14"/>
        <text x="96" y="364" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PENALIDADES ANEEL EVITADAS:</text>
        <text x="96" y="394" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="96" dy="0">• Parcela Variável (PV) por</tspan><tspan x="96" dy="18">indisponibilidade de funções de</tspan><tspan x="96" dy="18">transmissão 230/500 kV.</tspan></text>
        <text x="96" y="452" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="96" dy="0">• Estouro de limites DIC e FIC</tspan><tspan x="96" dy="18">com ressarcimento compulsório a</tspan><tspan x="96" dy="18">indústrias.</tspan></text>
        <text x="96" y="510" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="96" dy="0">• O Pyron identifica o conector</tspan><tspan x="96" dy="18">superaquecido meses antes do</tspan><tspan x="96" dy="18">colapso.</tspan></text>
        <text x="96" y="586" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A2CBF1">PAYBACK NA PRIMEIRA FALHA</text>
    </g>

    <!-- Coluna 2 -->
    <g id="roi-2" data-pptx-bounds="457 150 365 496">
        <rect x="457" y="150" width="365" height="496" rx="24" fill="#181C22" stroke="#353940" stroke-width="1"/>
        <rect x="481" y="174" width="160" height="24" rx="9999" fill="#0A0E14"/>
        <text x="561" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#A2CBF1">VIDA ÚTIL DO ATIVO</text>
        <text x="481" y="234" font-family="EB Garamond, Georgia, serif" font-size="20" font-weight="600" fill="#FFFFFF">Proteção de Transformador</text>
        <text x="481" y="280" font-family="EB Garamond, Georgia, serif" font-size="38" font-weight="400" fill="#FFFFFF">R$ 3,5 milhões</text>
        <text x="481" y="306" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">custo de reposição de ativo de força</text>
        <rect x="481" y="334" width="317" height="288" rx="14" fill="#0A0E14"/>
        <text x="497" y="364" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DEGRADAÇÃO RETARDADA:</text>
        <text x="497" y="394" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="497" dy="0">• Envelhecimento térmico do papel</tspan><tspan x="497" dy="18">kraft isolante segue Montsinger.</tspan></text>
        <text x="497" y="452" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="497" dy="0">• Ponto quente na bucha acelera</tspan><tspan x="497" dy="18">produção de gases combustíveis</tspan><tspan x="497" dy="18">(DGA).</tspan></text>
        <text x="497" y="510" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="497" dy="0">• Eliminar sobreaquecimento</tspan><tspan x="497" dy="18">preserva mais de 10 anos de vida</tspan><tspan x="497" dy="18">útil.</tspan></text>
        <text x="497" y="586" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A2CBF1">PROTEÇÃO DO ATIVO IMOBILIZADO</text>
    </g>

    <!-- Coluna 3 -->
    <g id="roi-3" data-pptx-bounds="858 150 366 496">
        <rect x="858" y="150" width="366" height="496" rx="24" fill="#181C22" stroke="#353940" stroke-width="1"/>
        <rect x="882" y="174" width="160" height="24" rx="9999" fill="#0A0E14"/>
        <text x="962" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#A2CBF1">EFICIÊNCIA DE CAMPO</text>
        <text x="882" y="234" font-family="EB Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#FFFFFF">Produtividade de Campo</text>
        <text x="882" y="280" font-family="EB Garamond, Georgia, serif" font-size="38" font-weight="400" fill="#A2CBF1">6,8x mais rápido</text>
        <text x="882" y="306" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">triagem e emissão pericial de laudo</text>
        <rect x="882" y="334" width="318" height="288" rx="14" fill="#0A0E14"/>
        <text x="898" y="364" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">GANHOS OPERACIONAIS:</text>
        <text x="898" y="394" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="898" dy="0">• Triagem de 300 imagens térmicas</tspan><tspan x="898" dy="18">cai de 2 dias para 40 minutos.</tspan></text>
        <text x="898" y="452" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="898" dy="0">• Eliminação de erros de</tspan><tspan x="898" dy="18">digitação e transcrição manual de</tspan><tspan x="898" dy="18">temperaturas.</tspan></text>
        <text x="898" y="510" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="898" dy="0">• Histórico automatizado de cada</tspan><tspan x="898" dy="18">conector rastreado ao longo dos</tspan><tspan x="898" dy="18">anos.</tspan></text>
        <text x="898" y="586" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A2CBF1">OTIMIZAÇÃO DO TEMPO TÉCNICO</text>
    </g>

</svg>