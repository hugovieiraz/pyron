<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
    <!-- Obsidian Frost Background -->
    <rect width="1280" height="720" fill="#10141A"/>
    <!-- Linhas Guia Estruturais -->
    <g id="deck-guides" data-pptx-role="decoration" data-pptx-bounds="56 140 1168 520" stroke="#1E293B" stroke-width="0.5">
        <line x1="56" y1="140" x2="1224" y2="140"/>
        <line x1="56" y1="660" x2="1224" y2="660"/>
    </g>
    
    <!-- Header Telemetria -->
    <g id="slide-header" data-pptx-role="header" data-pptx-bounds="56 36 1168 100">
        <rect x="56" y="36" width="304" height="24" rx="9999" fill="#1D4A6A" stroke="#A2CBF1" stroke-width="0.75"/>
        <text x="76" y="52" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="1.5">FEATURE 5 · INFERÊNCIA NORMATIVA</text>
        <text x="56" y="96" font-family="EB Garamond, Georgia, serif" font-size="36" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Motor Normativo Duplo: NBR 15866</text>
        <text x="56" y="124" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">Avaliação Simultânea de Aquecimento Relativo e Absoluto (% MTA) em 1,8 ms</text>
    </g>
    <!-- Footer Telemetria -->
    <g id="slide-footer" data-pptx-role="footer" data-pptx-bounds="56 676 1168 28">
        <line x1="56" y1="676" x2="1224" y2="676" stroke="#1E293B" stroke-width="1"/>
        <text x="56" y="694" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">PYRON MVP · TERMOGRAFIA DIGITAL PREDITIVA</text>
        <text x="640" y="694" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">CONFORMIDADE ABNT NBR 15866 &amp; IEC 60099-5 · 100% OFFLINE EDGE</text>
        <text x="1224" y="694" text-anchor="end" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" fill="#A2CBF1">07 / 12</text>
    </g>
    
    <!-- Matriz NBR (Esquerda) -->
    <g id="matrix-container" data-pptx-bounds="56 150 740 506">
        <rect x="56" y="150" width="740" height="506" rx="24" fill="#181C22" stroke="#353940" stroke-width="1"/>
        <text x="88" y="190" font-family="EB Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#FFFFFF">Matriz de Severidade Brasileira (5 Níveis Padronizados)</text>
        <text x="88" y="214" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">Vale a pior severidade entre os critérios relativo e absoluto; motivo fica registrado</text>

        <!-- Tabela -->
        <g id="table-levels">
            <!-- Header Tabela -->
            <rect x="88" y="238" width="676" height="34" rx="8" fill="#0A0E14"/>
            <text x="108" y="260" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">NÍVEL</text>
            <text x="210" y="260" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">ΔT RELATIVO CORRIGIDO</text>
            <text x="420" y="260" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">% DA MTA (ABSOLUTO)</text>
            <text x="610" y="260" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">REINSPEÇÃO</text>

            <!-- Linha 1: Normal -->
            <rect x="88" y="280" width="676" height="58" rx="8" fill="#262A31"/>
            <rect x="104" y="295" width="80" height="26" rx="9999" fill="#0A0E14"/>
            <text x="144" y="312" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">NORMAL</text>
            <text x="210" y="313" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">ΔT ≤ 5,0 °C</text>
            <text x="420" y="313" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">≤ 60,0% da MTA</text>
            <text x="610" y="313" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#A2CBF1">365 dias</text>

            <!-- Linha 2: Atenção -->
            <rect x="88" y="346" width="676" height="58" rx="8" fill="#262A31"/>
            <rect x="104" y="361" width="80" height="26" rx="9999" fill="#0A0E14"/>
            <text x="144" y="378" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">ATENÇÃO</text>
            <text x="210" y="379" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">5,1 °C a 10,0 °C</text>
            <text x="420" y="379" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">60,1% a 70,0% da MTA</text>
            <text x="610" y="379" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">90 dias</text>

            <!-- Linha 3: Programar -->
            <rect x="88" y="412" width="676" height="58" rx="8" fill="#262A31"/>
            <rect x="104" y="427" width="90" height="26" rx="9999" fill="#0A0E14"/>
            <text x="149" y="444" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#A2CBF1">PROGRAMAR</text>
            <text x="210" y="445" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">10,1 °C a 20,0 °C</text>
            <text x="420" y="445" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">70,1% a 80,0% da MTA</text>
            <text x="610" y="445" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">30 dias</text>

            <!-- Linha 4: Urgente -->
            <rect x="88" y="478" width="676" height="58" rx="8" fill="#262A31"/>
            <rect x="104" y="493" width="80" height="26" rx="9999" fill="#0A0E14"/>
            <text x="144" y="510" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFB4AB">URGENTE</text>
            <text x="210" y="511" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">20,1 °C a 40,0 °C</text>
            <text x="420" y="511" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" fill="#DFE2EB">80,1% a 100,0% da MTA</text>
            <text x="610" y="511" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFB4AB">7 dias</text>

            <!-- Linha 5: Imediato -->
            <rect x="88" y="544" width="676" height="58" rx="8" fill="#3B1219" stroke="#FFB4AB" stroke-width="1"/>
            <rect x="104" y="559" width="80" height="26" rx="9999" fill="#0A0E14"/>
            <text x="144" y="576" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFB4AB">IMEDIATO</text>
            <text x="210" y="577" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFB4AB">&gt; 40,0 °C</text>
            <text x="420" y="577" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFB4AB">&gt; 100,0% da MTA</text>
            <text x="610" y="577" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFB4AB">24 horas</text>
        </g>
        <text x="88" y="632" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" fill="#94A3B8">Critério NETA MTS (sobre o ambiente) disponível como alternativa configurável pelo gestor.</text>
    </g>

    <!-- Indicador de Performance (Direita) -->
    <g id="performance-card" data-pptx-bounds="816 150 408 506">
        <rect x="816" y="150" width="408" height="506" rx="24" fill="#181C22" stroke="#353940" stroke-width="1"/>
        <text x="848" y="190" font-family="EB Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#FFFFFF">Performance do Motor</text>
        <text x="848" y="214" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" fill="#94A3B8">Medido em bancada oficial com 9 regiões</text>

        <rect x="848" y="246" width="344" height="106" rx="14" fill="#0A0E14"/>
        <text x="872" y="274" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#A2CBF1">TEMPO DE CLASSIFICAÇÃO NORMATIVA</text>
        <text x="872" y="318" font-family="EB Garamond, Georgia, serif" font-size="44" font-weight="400" fill="#FFFFFF">1,8 ms</text>
        <text x="872" y="342" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="10" fill="#94A3B8">9 regiões térmicas avaliadas simultaneamente</text>

        <rect x="848" y="370" width="344" height="262" rx="14" fill="#262A31"/>
        <text x="872" y="400" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">SISTEMA DE AVISOS INTELIGENTES:</text>
        <text x="872" y="428" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="872" dy="0">• Carga &lt; 40%: Alerta de baixa</tspan><tspan x="872" dy="16">corrente avisando falhas ocultas.</tspan></text>
        <text x="872" y="466" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="872" dy="0">• Ponto &gt; 150 °C: Identifica</tspan><tspan x="872" dy="16">reflexo solar antes do alarme.</tspan></text>
        <text x="872" y="504" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#DFE2EB"><tspan x="872" dy="0">• Sem Ambiente: Classificação</tspan><tspan x="872" dy="16">provisória até confirmação.</tspan></text>
        <text x="872" y="542" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="400" fill="#FFB4AB"><tspan x="872" dy="0">• Ponto fora da peça: Emite aviso</tspan><tspan x="872" dy="16">&#x27;Confira antes de agir&#x27;.</tspan></text>
        <text x="872" y="584" font-family="Plus Jakarta Sans, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF"><tspan x="872" dy="0">MTA configurável por componente</tspan><tspan x="872" dy="16">(Cobre 90 °C, Óleo 65 °C).</tspan></text>
    </g>

</svg>